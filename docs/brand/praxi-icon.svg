  <rect x="27" y="14" width="10" height="36" rx="3" ry="3" fill="white"/>
  <!-- Smart dot -->
  <circle cx="55" cy="50" r="5" fill="white" opacity="0.15"/>
  <circle cx="55" cy="50" r="3" fill="white" opacity="0.85"/>
</svg>
