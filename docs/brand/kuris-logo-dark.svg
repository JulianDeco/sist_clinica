<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <style>
      .wordmark {
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: -1px;
        fill: #F8FAFC;
      }
      .tagline {
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 2.4px;
        fill: #64748B;
      }
    </style>
  </defs>

  <rect width="300" height="80" fill="#0D1117" rx="8"/>

  <!-- Icon -->
  <rect x="8" y="6" width="62" height="62" rx="13" fill="#3B82F6"/>
  <rect x="24" y="18" width="9" height="38" rx="2.5" fill="#0D1117"/>
  <polygon points="33,37 50,18 59,18 41,37" fill="#0D1117"/>
  <polygon points="33,40 50,56 59,56 41,40" fill="#0D1117"/>

  <!-- Wordmark -->
  <text x="86" y="52" class="wordmark">kuris</text>

  <!-- Tagline -->
  <text x="87" y="68" class="tagline">CLINICAL PLATFORM</text>
</svg>
