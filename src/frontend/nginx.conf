server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular Router: toda ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos con hash en el nombre (Angular default)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cachear index.html — siempre fresco
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
